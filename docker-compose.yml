version: '3.8'

services:
  orchestrator:
    build: ./backend
    restart: unless-stopped
    environment:
      - PRIVATE_KEY=${PRIVATE_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
